services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: live-auction-toxiproxy
    ports:
      - "8474:8474"
      - "15432:15432"
      - "16379:16379"
      - "18081:18081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
