groups:
  - name: live-auction-p1
    rules:
      - alert: LiveAuctionCriticalAnomaly
        expr: sum by (type, severity) (auction_anomaly_total{severity=~"HIGH|CRITICAL"}) > 0
        for: 1m
        labels:
          severity: critical
          component: diagnostics
        annotations:
          summary: "Live auction anomaly recorded"
          description: "Backend diagnostics recorded {{ $labels.severity }} anomaly {{ $labels.type }}."
          runbook: "docs/runbooks/alerts.md#liveauctioncriticalanomaly"

      - alert: LiveAuctionOutboxDeadLetter
        expr: increase(auction_outbox_dead_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          component: outbox
        annotations:
          summary: "Outbox delivery reached dead-letter state"
          description: "At least one outbox delivery exhausted retries in the last 5 minutes."
          runbook: "docs/runbooks/alerts.md#liveauctionoutboxdeadletter"

      - alert: LiveAuctionOutboxLagHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(auction_outbox_lag_seconds_bucket[5m]))) > 2
        for: 2m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: "Outbox delivery lag is elevated"
          description: "P95 outbox delivery lag is above the local P1 guard threshold for 2 minutes."
          runbook: "docs/runbooks/alerts.md#liveauctionoutboxlaghigh"

      - alert: LiveAuctionSchedulerDriftHigh
        expr: histogram_quantile(0.95, sum by (le, job_type) (rate(auction_scheduler_drift_seconds_bucket[5m]))) > 2
        for: 2m
        labels:
          severity: warning
          component: scheduler
        annotations:
          summary: "Scheduler drift is elevated"
          description: "P95 scheduler drift for {{ $labels.job_type }} is above the local P1 guard threshold."
          runbook: "docs/runbooks/alerts.md#liveauctionschedulerdrifthigh"

      - alert: LiveAuctionReconnectSpike
        expr: sum(increase(auction_ws_recover_total[5m])) > 50
        for: 1m
        labels:
          severity: warning
          component: websocket
        annotations:
          summary: "Reconnect activity spiked"
          description: "WebSocket recovery attempts increased sharply in the last 5 minutes."
          runbook: "docs/runbooks/alerts.md#liveauctionreconnectspike"

      - alert: LiveAuctionSnapshotRebuildPressure
        expr: sum(increase(auction_snapshot_source_total{source=~"db|snapshot_unavailable|stale_redis"}[5m])) > 20
        for: 1m
        labels:
          severity: warning
          component: recovery
        annotations:
          summary: "Snapshot recovery pressure is elevated"
          description: "Clients are relying on DB/stale/unavailable snapshot recovery paths."
          runbook: "docs/runbooks/alerts.md#liveauctionsnapshotrebuildpressure"

      - alert: LiveAuctionSlowConsumerDisconnects
        expr: increase(auction_ws_slow_consumer_disconnect_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          component: websocket
        annotations:
          summary: "Slow WebSocket consumers are being disconnected"
          description: "At least one slow consumer was closed in the last 5 minutes."
          runbook: "docs/runbooks/alerts.md#liveauctionslowconsumerdisconnects"

      - alert: LiveAuctionPTS1BBidGatewayP99High
        expr: histogram_quantile(0.99, sum by (le) (rate(auction_bid_gateway_stage_seconds_bucket{stage="total",mode="redis_ledger"}[2m]))) > 0.75
        for: 1m
        labels:
          severity: warning
          component: bid-gateway
          scenario: pts-1b
        annotations:
          summary: "PTS-1B bid gateway p99 exceeded the hot-path budget"
          description: "Redis-ledger bid handler p99 is above 750ms. Compare stage p99 with PTS sampled RTT before claiming a backend bottleneck."
          runbook: "docs/perf/pts/l4b-kafka/pts1b-observability-runbook-2026-05-30.md#triage-matrix"

      - alert: LiveAuctionPTS1BRedisLuaP99High
        expr: histogram_quantile(0.99, sum by (le) (rate(auction_bid_http_stage_seconds_bucket{stage="redis_lua"}[2m]))) > 0.1
        for: 1m
        labels:
          severity: warning
          component: redis-engine
          scenario: pts-1b
        annotations:
          summary: "PTS-1B Redis Lua p99 is elevated"
          description: "Redis decision Lua p99 is above 100ms, indicating Redis CPU/contention or oversized script work."
          runbook: "docs/perf/pts/l4b-kafka/pts1b-observability-runbook-2026-05-30.md#triage-matrix"

      - alert: LiveAuctionPTS1BKafkaAppendP99High
        expr: histogram_quantile(0.99, sum by (le) (rate(auction_bid_kafka_append_seconds_bucket{status="ok"}[2m]))) > 0.75
        for: 1m
        labels:
          severity: warning
          component: kafka
          scenario: pts-1b
        annotations:
          summary: "PTS-1B Kafka append p99 exceeded the sync-ack budget"
          description: "Kafka sync append p99 is above 750ms. Check broker health, ISR/min.insync settings, append timeouts, and pending-order wait."
          runbook: "docs/perf/pts/l4b-kafka/pts1b-observability-runbook-2026-05-30.md#triage-matrix"

      - alert: LiveAuctionPTS1BEnginePaused
        expr: increase(auction_bid_engine_pause_total[2m]) > 0
        for: 0m
        labels:
          severity: critical
          component: redis-engine
          scenario: pts-1b
        annotations:
          summary: "Redis ledger engine paused during PTS-1B"
          description: "Any engine pause invalidates a performance-only conclusion. Inspect pause_reason, pending decisions, Kafka append markers, and DLQ."
          runbook: "docs/perf/pts/l4b-kafka/pts1b-observability-runbook-2026-05-30.md#triage-matrix"

      - alert: LiveAuctionPTS1BPendingDecisionsStuck
        expr: max(auction_bid_redis_pending_decisions) > 0
        for: 2m
        labels:
          severity: critical
          component: redis-engine
          scenario: pts-1b
        annotations:
          summary: "Redis ledger pending decisions did not drain"
          description: "Pending decisions remaining after the burst means Kafka append or settlement recovery is incomplete."
          runbook: "docs/perf/pts/l4b-kafka/pts1b-observability-runbook-2026-05-30.md#triage-matrix"

      - alert: LiveAuctionSettlementLagHigh
        expr: auction_settlement_lag_p99_ms > 5000
        for: 2m
        labels:
          severity: warning
          component: settlement
        annotations:
          summary: "Settlement P99 lag is high"
          description: "P99 settlement lag exceeded 5 s for 2 minutes. Check worker count, Kafka consumer lag, and PG write load."
          runbook: "docs/current/test-strategy/s2-settlement-diagnosis-and-judge-defense.md"

      - alert: LiveAuctionSettlementPendingStuck
        expr: auction_settlement_pending_total > 100
        for: 3m
        labels:
          severity: warning
          component: settlement
        annotations:
          summary: "Large number of PROCESSING settlements not draining"
          description: "More than 100 settlements have been in PROCESSING state for over 3 minutes. Settlement worker may be stalled."
          runbook: "docs/current/test-strategy/s2-settlement-diagnosis-and-judge-defense.md"

      - alert: LiveAuctionTerminalNotFenced
        expr: increase(auction_reconcile_terminal_unfenced_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          component: redis-engine
        annotations:
          summary: "Cancelled/ended auction not fenced in Redis hot engine"
          description: "Reconciler found an auction in a terminal PG state whose Redis hot-state was not marked paused. Bids may have been accepted after cancellation. Check /api/monitor/redis-engine."
          runbook: "docs/current/fault-injection-runbook.md"
