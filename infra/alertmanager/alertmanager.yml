global:
  resolve_timeout: 5m

# Route all alerts to the live-auction backend webhook so every firing alert
# is persisted in system_anomaly_events and surfaced in /api/monitor/anomalies.
route:
  group_by: ['alertname', 'component']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  receiver: 'live-auction-webhook'

receivers:
  - name: 'live-auction-webhook'
    webhook_configs:
      - url: 'http://host.docker.internal:18080/api/internal/alert-webhook'
        send_resolved: true
        http_config:
          # Internal network only — no TLS required.
          tls_config:
            insecure_skip_verify: false
