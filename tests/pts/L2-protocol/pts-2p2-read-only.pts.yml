version: "1.0"
name: live-auction-l2-p2-read-only
description: Auxiliary PTS-native/YML HTTP read traffic for L2-P2 attribution. Formal L2 evidence remains the JMeter scenario.
baseUrl: "http://172.16.179.112:18080"
headers:
  Accept: "application/json"
  Content-Type: "application/json"
variables:
  token: "${token}"
apis:
  - name: get_auction_snapshot
    method: GET
    path: "/api/auctions/auc_live"
    headers:
      Authorization: "Bearer ${token}"
  - name: get_auction_leaderboard
    method: GET
    path: "/api/auctions/auc_live/leaderboard?limit=5"
    headers:
      Authorization: "Bearer ${token}"
  - name: get_my_bid_history
    method: GET
    path: "/api/users/me/bids"
    headers:
      Authorization: "Bearer ${token}"
